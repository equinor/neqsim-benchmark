name: Release NeqSim Update

on:
  workflow_run:
    workflows: [Compare Benchmark Timings]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-neqsim-update
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check NeqSim version change and verify release target
        id: neqsim
        shell: python
        env:
          BENCHMARK_RUN_ID: ${{ github.event.workflow_run.id }}
          BENCHMARK_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BENCHMARK_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          MANUAL_REQUEST: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def neqsim_version(pom):
              root = ET.fromstring(pom)
              namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
              for dependency in root.findall("m:dependencies/m:dependency", namespace):
                  group = dependency.findtext("m:groupId", namespaces=namespace)
                  artifact = dependency.findtext("m:artifactId", namespaces=namespace)
                  if group == "com.equinor.neqsim" and artifact == "neqsim":
                      version = dependency.findtext("m:version", namespaces=namespace)
                      if version and version.strip().startswith("${") and version.strip().endswith("}"):
                          property_name = version.strip()[2:-1]
                          version = root.findtext(f"m:properties/m:{property_name}", namespaces=namespace)
                      if version and version.strip() and "${" not in version:
                          return version.strip()
                      raise ValueError("NeqSim dependency version could not be resolved")
              raise ValueError("NeqSim dependency not found")

          source_commit = os.environ["BENCHMARK_SOURCE_COMMIT"]
          if not source_commit or not all(character in "0123456789abcdef" for character in source_commit):
              raise ValueError("Invalid benchmark source commit")
          current_pom = subprocess.check_output(["git", "show", f"{source_commit}:pom.xml"])
          previous_pom = subprocess.check_output(["git", "show", f"{source_commit}^:pom.xml"])
          changed = neqsim_version(current_pom) != neqsim_version(previous_pom)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"changed={str(changed).lower()}\n")
          if not changed:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("ready=false\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Skipping release: the source commit did not change "
                                "the NeqSim dependency version in pom.xml.\n")
              raise SystemExit(0)
          if os.environ["MANUAL_REQUEST"] == "true":
              raise SystemExit(0)

          run_id = os.environ["BENCHMARK_RUN_ID"]
          attempt = os.environ["BENCHMARK_RUN_ATTEMPT"]
          if not run_id.isdigit() or not attempt.isdigit():
              raise ValueError("Invalid benchmark run identifiers")
          paths = list(Path("benchmark-results/releases").glob(
              f"*/from-*/run-{run_id}-{attempt}/comparison.json"))
          if not paths:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("ready=false\n")
              raise SystemExit(0)
          candidates = [(path, json.loads(path.read_text())) for path in paths]
          record_path, record = max(candidates, key=lambda item: (int(item[1]["run_id"]),
                                                                  int(item[1]["run_attempt"])))
          source_commit = record["source_commit"]
          if record.get("status") != "complete":
              raise ValueError("Benchmark comparison is incomplete")
          if (source_commit != os.environ["BENCHMARK_SOURCE_COMMIT"]
                  or record.get("run_id") != os.environ["BENCHMARK_RUN_ID"]
                  or record.get("run_attempt") != os.environ["BENCHMARK_RUN_ATTEMPT"]):
              raise ValueError("Benchmark results belong to a different run")
          if not source_commit or not all(character in "0123456789abcdef" for character in source_commit):
              raise ValueError("Invalid benchmark source commit")
          for name in ("pom.xml", "comparison.md", "transcript.md",
                       "baseline-benchmarks.json", "current-benchmarks.json"):
              if not record_path.with_name(name).is_file():
                  raise ValueError(f"Missing benchmark evidence: {name}")
          target = subprocess.check_output(
              ["git", "log", "-1", "--format=%H", "--", str(record_path)], text=True).strip()
          if not target:
              raise ValueError("Benchmark results have not been committed")
          pom = subprocess.check_output(["git", "show", f"{target}:pom.xml"])
          if pom != record_path.with_name("pom.xml").read_bytes():
              raise ValueError("The results commit POM differs from the benchmarked POM")
          version = neqsim_version(pom)
          if version != record.get("current_version"):
              raise ValueError("The results commit contains a different NeqSim version; rerun benchmarks")
          subprocess.run(["git", "diff", "--exit-code", source_commit, target, "--",
                          "src", ".github/scripts/benchmark-timings.py",
                          ".github/scripts/run-benchmark-timings.sh",
                          ".github/scripts/neqsim-jar-version.py",
                          ".github/scripts/benchmark-revision.py"], check=True)
          tag = f"neqsim-{version}"
          subprocess.run(["git", "check-ref-format", f"refs/tags/{tag}"], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready=true\nversion={version}\ntag={tag}\ncommit={target}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"NeqSim {version}: releasing results commit {target}.\n")

      - name: Run benchmarks before a manually requested release
        if: github.event_name == 'workflow_dispatch' && steps.neqsim.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run benchmark-timings.yml --ref "$DEFAULT_BRANCH"

      - name: Publish GitHub release
        if: steps.neqsim.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEQSIM_VERSION: ${{ steps.neqsim.outputs.version }}
          RELEASE_TAG: ${{ steps.neqsim.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.neqsim.outputs.commit }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "NeqSim $NEQSIM_VERSION benchmarks" \
            --notes "Updated benchmark project to NeqSim $NEQSIM_VERSION. Full benchmark timing comparison passed with Java 21. This release targets the commit containing both the benchmarked POM and committed benchmark-results tables, raw results, and transcripts. No JAR is attached."
