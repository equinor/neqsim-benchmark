name: Check NeqSim Updates

on:
  release:
    types: [published]
  # Merging a dependency update changes pom.xml on the default branch; checking again right away
  # chains one comparison per NeqSim release until the dependency is up to date.
  push:
    branches: [main]
    paths:
      - pom.xml
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-neqsim-updates
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Find the next stable NeqSim release on Maven Central
        id: next
        shell: python
        run: |
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          pom = ET.fromstring(Path("pom.xml").read_bytes())
          dependency = next((item for item in pom.findall("m:dependencies/m:dependency", namespace)
                             if item.findtext("m:groupId", namespaces=namespace) == "com.equinor.neqsim"
                             and item.findtext("m:artifactId", namespaces=namespace) == "neqsim"), None)
          if dependency is None:
              raise ValueError("com.equinor.neqsim:neqsim dependency was not found in pom.xml")
          declared = dependency.findtext("m:version", default="", namespaces=namespace).strip()
          property_name = declared[2:-1] if re.fullmatch(r"\$\{[^{}]+\}", declared) else ""
          current = (pom.findtext(f"m:properties/m:{property_name}", namespaces=namespace)
                     if property_name else declared)
          if current is None or not re.fullmatch(r"[0-9]+(?:\.[0-9]+)*", current.strip()):
              raise ValueError(f"NeqSim dependency {declared!r} resolves to {current!r}; "
                               "expected a stable numeric release")
          current = current.strip()
          url = "https://repo.maven.apache.org/maven2/com/equinor/neqsim/neqsim/maven-metadata.xml"
          with urllib.request.urlopen(url, timeout=30) as response:
              metadata = ET.fromstring(response.read())
          versions = [element.text.strip() for element in metadata.findall("versioning/versions/version")
                      if element.text and re.fullmatch(r"[0-9]+(?:\.[0-9]+)*", element.text.strip())]
          if not versions:
              raise ValueError("Maven Central returned no stable NeqSim releases")
          width = max(len(version.split(".")) for version in versions + [current])

          def version_key(version):
              parts = tuple(int(part) for part in version.split("."))
              return parts + (0,) * (width - len(parts))

          newer = sorted({version for version in versions if version_key(version) > version_key(current)},
                         key=version_key)
          next_version = newer[0] if newer else ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={next_version}\nproperty={property_name}\ncurrent={current}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Current NeqSim: {current}. Next release: {next_version or 'none'}.\n")

      - name: Update to the next stable NeqSim release
        if: steps.next.outputs.version != ''
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          NEQSIM_PROPERTY: ${{ steps.next.outputs.property }}
        run: |
          if [[ -n "$NEQSIM_PROPERTY" ]]; then
            mvn --batch-mode --no-transfer-progress \
              org.codehaus.mojo:versions-maven-plugin:2.18.0:set-property \
              -Dproperty="$NEQSIM_PROPERTY" -DnewVersion="$NEXT_VERSION" \
              -DgenerateBackupPoms=false
          else
            mvn --batch-mode --no-transfer-progress \
              org.codehaus.mojo:versions-maven-plugin:2.18.0:use-dep-version \
              -Dincludes=com.equinor.neqsim:neqsim -DdepVersion="$NEXT_VERSION" \
              -DforceVersion=true -DgenerateBackupPoms=false
          fi

      - name: Detect dependency update
        id: update
        env:
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          # The daily check must not re-run the multi-hour comparison while a pull request for
          # the same release is still open for review.
          proposed=""
          if git fetch --quiet --depth 1 origin automation/neqsim-update 2>/dev/null; then
            proposed="$(git show FETCH_HEAD:pom.xml | python3 -c 'import re,sys; m=re.search(r"<neqsim.version>([^<]+)</neqsim.version>", sys.stdin.read()); print(m.group(1) if m else "")')"
          fi
          if git diff --quiet -- pom.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "NeqSim is already up to date." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$NEXT_VERSION" && "$proposed" == "$NEXT_VERSION" && "${{ github.event_name }}" != workflow_dispatch ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "A pull request for NeqSim $NEXT_VERSION is already open; run manually to re-measure it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The next NeqSim release is available; verifying the build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Benchmark current and next NeqSim releases
        if: steps.update.outputs.changed == 'true'
        env:
          BASELINE_VERSION: ${{ steps.next.outputs.current }}
          CURRENT_VERSION: ${{ steps.next.outputs.version }}
          NEQSIM_PROPERTY: ${{ steps.next.outputs.property }}
        run: bash .github/scripts/run-benchmark-timings.sh "$BASELINE_VERSION" "$CURRENT_VERSION"

      - name: Save benchmark results and build failures beside the updated POM
        if: steps.update.outputs.changed == 'true'
        env:
          BASELINE_VERSION: ${{ steps.next.outputs.current }}
          CURRENT_VERSION: ${{ steps.next.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/benchmark-timings.py \
            "$RUNNER_TEMP/baseline-benchmarks.json" "$RUNNER_TEMP/current-benchmarks.json" \
            --baseline-version "$BASELINE_VERSION" --current-version "$CURRENT_VERSION" \
            --baseline-list "$RUNNER_TEMP/baseline-benchmarks.txt" \
            --current-list "$RUNNER_TEMP/current-benchmarks.txt" \
            --archive-dir benchmark-results --pom-file pom.xml \
            --source-commit "$(git rev-parse HEAD)" --run-url "$RUN_URL"
          {
            printf 'Update `com.equinor.neqsim:neqsim` from %s to the next stable release, %s.\n\n' \
              "$BASELINE_VERSION" "$CURRENT_VERSION"
            if [[ -f "$RUNNER_TEMP/benchmark-timing-summary.md" ]]; then
              cat "$RUNNER_TEMP/benchmark-timing-summary.md"
            else
              printf 'No timing summary was produced; see the saved transcript.\n'
            fi
            printf '\n---\n\n'
            printf 'Full results, raw JMH JSON, the POM snapshot and transcripts are saved under `benchmark-results/`.\n'
            printf 'Both versions were checked with Java 21. Maven build failures and correctness test failures are\n'
            printf 'recorded without blocking this PR; incomplete runs report no overall gain and do not qualify for a\n'
            printf 'benchmark-verified release. Prereleases are excluded and intermediate stable releases are not skipped:\n'
            printf 'merging this PR starts the check for the next release automatically.\n'
            printf 'Review compatibility and benchmark results before merging.\n'
          } > "$RUNNER_TEMP/pull-request-body.md"
          # GitHub limits pull request bodies to 65536 characters.
          python3 - "$RUNNER_TEMP/pull-request-body.md" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          if len(text) > 60000:
              path.write_text(text[:60000] + "\n\n(Truncated; see benchmark-results/ for the full report.)\n")
          PY

      - name: Verify measured base is still the default branch head
        if: steps.update.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          measured_commit="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH")"
          current_commit="${remote_head%%$'\t'*}"
          if [[ "$measured_commit" != "$current_commit" ]]; then
            message="The default branch advanced from measured commit $measured_commit to $current_commit during benchmarking. Rerun Check NeqSim Updates against the latest sources; measured results will not be rebased or published from a stale workflow snapshot."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Open or update dependency pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/neqsim-update
          delete-branch: true
          add-paths: |
            pom.xml
            benchmark-results/
          commit-message: "build: update NeqSim to ${{ steps.next.outputs.version }}"
          title: "build: update NeqSim to ${{ steps.next.outputs.version }}"
          body-path: ${{ runner.temp }}/pull-request-body.md
